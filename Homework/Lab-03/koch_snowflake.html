<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Koch Snowflake</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f5f5f5;
    }

    canvas {
      border: 3px solid #007bff;
      background: white;
      margin-top: 20px;
      border-radius: 10px;
    }

    .controls {
      margin-top: 20px;
    }

    input {
      padding: 6px;
      font-size: 16px;
    }

    button {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Koch Snowflake Fractal</h2>

  <div class="controls">
    Level:
    <input type="number" id="level" min="0" max="6" value="3">
    <button onclick="render()">Draw</button>
  </div>

  <canvas id="canvas" width="600" height="600"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawKochSnowflake(level) {
      const size = 350;
      const height = size * Math.sqrt(3) / 2;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const A = { x: centerX, y: centerY - height / 2 };
      const B = { x: centerX - size / 2, y: centerY + height / 2 };
      const C = { x: centerX + size / 2, y: centerY + height / 2 };

      ctx.beginPath();
      ctx.moveTo(A.x, A.y);

      drawKoch(A, B, level);
      drawKoch(B, C, level);
      drawKoch(C, A, level);

      ctx.stroke();
    }

    function drawKoch(p1, p2, level) {
      if (level === 0) {
        ctx.lineTo(p2.x, p2.y);
        return;
      }

      const dx = (p2.x - p1.x) / 3;
      const dy = (p2.y - p1.y) / 3;

      const pa = { x: p1.x + dx, y: p1.y + dy };
      const pb = { x: p1.x + 2 * dx, y: p1.y + 2 * dy };

      const baseAngle = Math.atan2(dy, dx);
      const angle = baseAngle + Math.PI / 3;
      const length = Math.hypot(dx, dy);

      const peak = {
        x: pa.x + Math.cos(angle) * length,
        y: pa.y + Math.sin(angle) * length
      };

      drawKoch(p1, pa, level - 1);
      drawKoch(pa, peak, level - 1);
      drawKoch(peak, pb, level - 1);
      drawKoch(pb, p2, level - 1);
    }

    function render() {
      clearCanvas();

      const level = parseInt(document.getElementById("level").value, 10);
      ctx.strokeStyle = "black";

      drawKochSnowflake(Math.max(0, Math.min(level, 6)));
    }
  </script>

</body>
</html>
